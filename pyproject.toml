[project]
name = "meteo"
version = "0.1.0"
description = ""
authors = [
    {name = "Panos Mavrogiorgos",email = "pmav99@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "xarray[full]",
    "cyclopts",
    "logfmter",
    "ecmwf-api-client",
    "cdsapi",
    "earthkit-geo",
    "earthkit-data",
    "platformdirs",
    "cf-xarray",
    "isoduration",
]

[project.optional-dependencies]
hycom = ["gsw", "netcdf4"]
complete = ["gsw", "netcdf4", "copernicusmarine", "cfgrib", "earthkit-geo"]
cmems = ["copernicusmarine"]
sflux = ["cfgrib"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ipython = "*"
ipykernel = "^7.4.0"

[tool.poetry.group.test.dependencies]
pytest = "9.2.0"

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.poetry.scripts]
meteo = "meteo.__main__:main"
